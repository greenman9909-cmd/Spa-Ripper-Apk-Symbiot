<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Return to the app</title>
  <script src="return.js"></script>
  <style>
    :root{color-scheme:dark;font:18px/1.6 system-ui,sans-serif;background:#101116;color:#f4f4f5}
    body{margin:0;min-height:100svh;display:grid;place-items:center}
    main{box-sizing:border-box;max-width:34rem;padding:2rem;margin:1rem}
    h1{font-size:2rem;line-height:1.2;margin:0 0 1rem;color:#ff851b}
    p{margin:1rem 0;color:#ddd}small{display:block;color:#aaa}
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Return to the app</h1>
    <p id="message">After confirming your email, reopen the Android app and log in with your email and password.</p>
    <small id="detail">This page does not sign you in or store your account details.</small>
    <noscript><p>For your privacy, close this tab after opening your confirmation link. If the link expired, request a new email.</p></noscript>
  </main>
</body>
</html>
